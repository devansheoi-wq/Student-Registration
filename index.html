
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Devansh Pandey</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>

    <main class="container">
        <section class="form-card">
            <div class="logo">🎓</div>
            <h1>Student Registration</h1>
            <p class="subtitle">Register today and start your journey!</p>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName"
                           placeholder="Enter your full name"
                           minlength="2" maxlength="80" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="you@example.com"
                           maxlength="254" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                           placeholder="10-digit mobile number"
                           pattern="[0-9]{10}" maxlength="10"
                           inputmode="numeric" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="course">Select Course</label>
                    <select id="course" required>
                        <option value="">Choose your course</option>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="B.Tech Cyber Security">B.Tech Cyber Security</option>
                        <option value="BCA">BCA</option>
                        <option value="MCA">MCA</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <label class="consent">
                    <input type="checkbox" id="consent" required>
                    I agree to submit these details for registration.
                </label>

                <button type="submit" id="submitBtn">
                    Register Now
                </button>

                <p id="status" role="status" aria-live="polite"></p>
            </form>

            <p class="footer">Made with ❤️ by Devansh Pandey</p>
        </section>
    </main>

</body>
</html>
